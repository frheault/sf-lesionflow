report_comment: >
  This subject diagnostic report was generated by the 
  <a href="https://github.com/frheault/sf-lesionflow" target="_blank">sf-lesionflow</a> pipeline.

title: "sf-lesionflow Diagnostic Subject Report"

report_section_order:
  "sf-lesionflow-methods-description":
    order: -1002
  multiqc_software_versions:
    order: -1001
  software_versions:
    order: -1001
  "sf-lesionflow-summary":
    title: "Workflow Summary"
    order: -1000
  "lesion_segmentation_qc":
    order: 110
  "lesion_consensus_summary":
    order: 105
  "lesion_ensemble_volumes":
    order: 100
  "lesion_pairwise_dice":
    order: 95
  "lesion_instance_table":
    order: 90
  "longitudinal_summary":
    order: 85
  "lesion_trajectory_fates":
    order: 82
  "registration_flair_to_t1_qc":
    order: 80
  "registration_t1_to_baseline_qc":
    order: 75
  "registration_t1_to_mni_qc":
    order: 70
  "registration_metrics":
    order: 60

# Table Column Formatting
table_columns_visible:
  "lesion_consensus_summary":
    Consensus_TLV_mL: true
    Consensus_Lesion_Count: true
    Mean_Inter_Algo_Dice: true
  "longitudinal_summary":
    Net_Delta_TLV_mL: true
    Percent_Change: true
    New_Lesions: true

# Image and metric sections for Subject Visual QC
custom_data:
  lesion_consensus_summary:
    headers:
      Consensus_TLV_mL:
        title: "TLV (mL)"
        description: "Total Lesion Volume from STAPLE consensus mask in milliliters"
        format: "{:,.2f}"
        scale: "YlOrRd"
      Consensus_Lesion_Count:
        title: "Lesion Count"
        description: "Total number of discrete connected components in the STAPLE binary mask"
        format: "{:d}"
        scale: "PuBu"
      Mean_Inter_Algo_Dice:
        title: "Ensemble Dice"
        description: "Mean pairwise Dice similarity across all active algorithms"
        min: 0.0
        max: 1.0
        format: "{:,.3f}"
        scale: "RdYlGn"
  longitudinal_summary:
    headers:
      Net_Delta_TLV_mL:
        title: "Δ TLV (mL)"
        description: "Net change in Total Lesion Volume between baseline and final follow-up"
        format: "{:,.2f}"
        scale: "RdBu-rev"
      Percent_Change:
        title: "% Vol Change"
        description: "Percentage volume change from baseline. Single-session subjects show 0% (expected: baseline-only)."
        suffix: "%"
        format: "{:,.1f}"
        scale: "RdBu-rev"
      New_Lesions:
        title: "New Lesions"
        description: "Number of newly emerged lesion instances"
        format: "{:d}"
        scale: "OrRd"
  lesion_segmentation_qc:
    file_format: "png"
    section_name: "STAPLE Consensus Lesion Segmentation"
    description: |
      Visual inspection of the final STAPLE consensus lesion segmentation (red semi-transparent overlay
      with yellow boundary contour) on the native FLAIR sequence. 
      **What to look for:**
      - Ensure small periventricular and juxtacortical lesions are accurately contoured without bleeding into CSF spaces.
      - Check for absence of false positive segmentation along the cortex or meninges.
    plot_type: "image"

  registration_flair_to_t1_qc:
    file_format: "png"
    section_name: "FLAIR to T1w Rigid Coregistration"
    description: |
      Checkerboard overlay between fixed T1w and moving FLAIR volumes.
      **What to look for:**
      - Continuity of anatomical structures (ventricular horns, corpus callosum, cortical gyri) across alternating squares.
    plot_type: "image"

  registration_t1_to_baseline_qc:
    file_format: "png"
    section_name: "T1w Follow-up to Baseline Rigid Registration"
    description: |
      Checkerboard overlay between fixed baseline T1w and moving follow-up T1w volumes.
      **What to look for:**
      - Alignment and spatial continuity of brain boundaries and ventricles across timepoints.
    plot_type: "image"

  registration_t1_to_mni_qc:
    file_format: "png"
    section_name: "T1w to MNI Standard Space Normalization"
    description: |
      Checkerboard overlay between MNI reference template and warped baseline T1w volume.
      **What to look for:**
      - Alignment of global brain envelope, basal ganglia boundaries, and ventricles with MNI space.
    plot_type: "image"

# Search patterns for Custom Content images and versions
sp:
  software_versions:
    fn: "*versions*.yml"
  lesion_segmentation_qc:
    fn: "*_lesion_consensus_mqc.png"
  registration_flair_to_t1_qc:
    fn: "*_registration_flair_to_t1_mqc.png"
  registration_t1_to_baseline_qc:
    fn: "*_registration_t1_to_baseline_mqc.png"
  registration_t1_to_mni_qc:
    fn_re: ".*registration_(baseline|t1)_to_mni_mqc\\.png"

table_cond_formatting_rules:
  Mean_Inter_Algo_Dice:
    fail:
      - lt: 0.25
    warn:
      - lt: 0.40
    pass:
      - ge: 0.40
  Percent_Change:
    fail:
      - gt: 100.0
      - lt: -100.0
    warn:
      - gt: 50.0
      - lt: -50.0
