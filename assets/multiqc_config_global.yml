# Disable MultiQC's hosted "AI summary" features: reports may contain clinical data.
no_ai: true

report_comment: >
  This global population report was generated by the 
  <a href="https://github.com/frheault/sf-lesionflow" target="_blank">sf-lesionflow</a> 
  Multiple Sclerosis lesion segmentation and longitudinal harmonization pipeline.

title: "sf-lesionflow Global Quality Control Report"

report_section_order:
  "sf-lesionflow-methods-description":
    order: -1002
  multiqc_software_versions:
    order: -1001
  software_versions:
    order: -1001
  "sf-lesionflow-summary":
    title: "sf-lesionflow Execution Summary"
    order: -1000
  "lesion_consensus_summary":
    order: 100
  "lesion_ensemble_volumes":
    order: 90
  "lesion_pairwise_dice":
    order: 80
  "longitudinal_summary":
    order: 70
  "lesion_trajectory_fates":
    order: 60
  "lesion_brainmask_removal":
    order: 55
  "registration_metrics":
    order: 50

# General Statistics Column Customization
table_columns_visible:
  "lesion_consensus_summary":
    TLV_MNI_mL: true
    Consensus_Lesion_Count: true
    Mean_Inter_Algo_Dice: true
  "longitudinal_summary":
    Net_Delta_TLV_MNI_mL: true
    Percent_Change: true
    New_Lesions: true

custom_data:
  lesion_consensus_summary:
    headers:
      TLV_MNI_mL:
        title: "TLV (MNI mL)"
        description: "MNI-normalized Total Lesion Volume of the STAPLE consensus: mL on the template grid after affine normalization of the baseline T1w (head-size normalized). Native volume = TLV / Affine_Scale_Factor (registration table)."
        format: "{:,.2f}"
        scale: "YlOrRd"
      Consensus_Lesion_Count:
        title: "Lesion Count"
        description: "Total number of discrete connected components in the STAPLE binary mask"
        format: "{:d}"
        scale: "PuBu"
      Mean_Inter_Algo_Dice:
        title: "Ensemble Dice"
        description: "Mean pairwise Dice similarity across all active algorithms"
        min: 0.0
        max: 1.0
        format: "{:,.3f}"
        scale: "RdYlGn"
  longitudinal_summary:
    headers:
      Net_Delta_TLV_MNI_mL:
        title: "Δ TLV (MNI mL)"
        description: "Net change in MNI-normalized Total Lesion Volume between baseline and final follow-up (all sessions share the baseline normalization, so the change is comparable)"
        format: "{:,.2f}"
        scale: "RdBu-rev"
      Percent_Change:
        title: "% Vol Change"
        description: "Percentage volume change from baseline. Single-session subjects show 0% (expected: baseline-only)."
        suffix: "%"
        format: "{:,.1f}"
        scale: "RdBu-rev"
      New_Lesions:
        title: "New Lesions"
        description: "Number of newly emerged lesion instances"
        format: "{:d}"
        scale: "OrRd"

# Search patterns
sp:
  software_versions:
    fn: "*versions*.yml"

  registration_metrics:
    headers:
      NCC:
        title: "NCC"
        description: "Pearson correlation between fixed and warped moving image inside the fixed foreground"
        format: "{:,.3f}"
      NMI:
        title: "NMI"
        description: "Studholme normalized mutual information (1 = independent, 2 = identical)"
        format: "{:,.3f}"
      Mask_Dice:
        title: "Mask Dice"
        description: "Dice overlap of the fixed and warped foregrounds (brain envelope)"
        format: "{:,.3f}"
      Affine_Scale_Factor:
        title: "Scale |det A|"
        description: "Volume scaling of the transform (1 for rigid stages). MNI-normalized volume = native volume x this factor."
        format: "{:,.3f}"

table_cond_formatting_rules:
  Mean_Inter_Algo_Dice:
    fail:
      - lt: 0.25
    warn:
      - lt: 0.40
    pass:
      - ge: 0.40
  Status:
    pass:
      - s_eq: "PASS"
    warn:
      - s_contains: "WARN"
  Percent_Change:
    fail:
      - gt: 100.0
      - lt: -100.0
    warn:
      - gt: 50.0
      - lt: -50.0
